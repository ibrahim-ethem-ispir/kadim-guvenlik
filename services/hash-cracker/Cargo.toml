[package]
name = "hash-cracker"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
uuid = { version = "1.0", features = ["v4"] }
parking_lot = "0.12"
hex = "0.4"
regex = "1"

# Parallelism - Critical for performance
rayon = "1.10"

# Hash Algorithms
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"           # SHA3 / Keccak (modern)
blake2 = "0.10"        # BLAKE2 (modern, faster than SHA)
blake3 = "1.5"         # BLAKE3 (ultra-modern, fastest secure hash)
argon2 = "0.5"         # Argon2id (password hashing competition winner)
bcrypt = "0.15"        # bcrypt verification
scrypt = "0.11"        # scrypt (memory-hard)
pbkdf2 = { version = "0.12", features = ["sha2"] }  # PBKDF2-SHA256

# Base encoding
base64 = "0.21"

# Additional utilities
once_cell = "1.19"
itertools = "0.12"
num_cpus = "1.16"
md4 = "0.10"           # For NTLM hash support
