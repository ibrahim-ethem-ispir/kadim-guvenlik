[package]
name = "stress-service"
version = "0.1.0"
edition = "2021"
description = "Kadim Güvenlik — yük testi ve endpoint dayanıklılık servisi"
license = "MIT"
keywords = ["load-testing", "stress-testing", "security"]

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# HTTP Client
reqwest = { version = "0.12", features = ["rustls-tls", "gzip", "stream"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Utilities
uuid = { version = "1.0", features = ["v4"] }
parking_lot = "0.12"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"

# Async utilities
async-stream = "0.3"
tokio-stream = "0.1"

# Database (optional for logging)
mongodb = { version = "2.8", optional = true }

# Simple regex for link extraction
regex-lite = "0.1"
