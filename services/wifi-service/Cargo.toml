# Bu paket kendi workspace köküdür: services/rust/ altındaki ortak workspace'ten
# BİLİNÇLİ olarak hariç (Kali base + actix-web, ortak bağımlılık grafiği yok).
# Aksi halde kendi Docker context'inden derlenirken "workspace bulunamadı" hatası verir.
[workspace]

[package]
name = "wifi-service"
version = "0.1.0"
edition = "2021"
description = "Kadim Güvenlik — kablosuz ağ güvenlik denetim servisi"
license = "MIT"
keywords = ["wifi", "security", "audit"]

[dependencies]
actix-web = "4"
actix-multipart = "0.6"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
