# =============================================================================
# Kadim Güvenlik — Rust servisleri TEK Cargo workspace
# =============================================================================
# Konum: services/rust/ altında toplanmıştır; Python/Go servisleri services/ Kökünde
# kalır. Böylece "hangi servis Rust?" sorusu dizin yapısından okunur.
#
# Neden workspace: 7 servis ayrı ayrı derlenince aynı crate'ler (tokio, axum, serde,
# mongodb, reqwest, tracing ...) her servis için yeniden derleniyordu. Tek workspace
# = tek Cargo.lock + tek target dizini + derleme önbelleğinin servisler arası paylaşımı.
#
# wifi-service BİLİNÇLİ OLARAK dışarıda (services/wifi-service): actix-web + Kali
# taban + aircrack-ng bağımlılığı var, ortak bağımlılık grafiği paylaşmıyor ve kendi
# [workspace] kökünü ilan eder.
# =============================================================================
[workspace]
resolver = "2"
members = [
  "auth-service",
  "fuzz-service-rs",
  "hash-cracker",
  "osint-service",
  "recon-service",
  "researcher-service",
  "stress-service",
]

# Tek merkezî release profili — üyelerin kendi [profile.release] bölümü YOK
# sayılır (Cargo kök olmayan paketlerde profili yok sayar). Eski osint/researcher
# ayarları (lto + codegen-units=1 + strip) buraya taşındı.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
