# Türkçe: WebSocket connection upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    
    # Türkçe: Docker internal DNS resolver - servislerin dinamik çözümü için
    # Bu sayede servis yoksa bile nginx başlayabilir
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    
    # Türkçe: Uzun süreli taramalar için timeout ayarları
    proxy_connect_timeout 7200s;
    proxy_send_timeout 7200s;
    proxy_read_timeout 7200s;
    send_timeout 7200s;

    # Frontend
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Orchestrator API (General) - WebSocket için özel ayarlar
    location /api/ {
        set $orchestrator_upstream http://orchestrator:8000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $orchestrator_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # WebSocket support - uzun süreli bağlantılar için
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Türkçe: Timeout ayarları (2 saat = 7200 saniye)
        proxy_connect_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_read_timeout 7200s;
        
        # Türkçe: Buffering'i kapat (real-time stream için)
        proxy_buffering off;
        proxy_cache off;
    }

    # Recon Intelligence API (formerly CF Analyzer)
    location /api/recon/ {
        set $recon_upstream http://recon-service:8004;
        rewrite ^/api/recon/(.*) /$1 break;
        proxy_pass $recon_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # CF Analyzer API (backward compatibility - routes to recon-service via orchestrator)
    location /api/cf-analyzer/ {
        set $orchestrator_upstream http://orchestrator:8000;
        proxy_pass $orchestrator_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Nmap API
    location /api/nmap/ {
        set $nmap_upstream http://nmap-service:8001;
        rewrite ^/api/nmap/(.*) /$1 break;
        proxy_pass $nmap_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Subfinder API (Subdomain Discovery)
    location /api/subfinder/ {
        set $subfinder_upstream http://subfinder-service:8010;
        rewrite ^/api/subfinder/(.*) /$1 break;
        proxy_pass $subfinder_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Nuclei API
    location /api/nuclei/ {
        set $nuclei_upstream http://nuclei-service:8003;
        rewrite ^/api/nuclei/(.*) /$1 break;
        proxy_pass $nuclei_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # RustScan API
    location /api/rustscan/ {
        set $rustscan_upstream http://rustscan-service:8002;
        rewrite ^/api/rustscan/(.*) /$1 break;
        proxy_pass $rustscan_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # WebSocket support (real-time monitoring için)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Port taraması uzun sürebilir
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }


    # OSINT Service API
    location /api/osint/ {
        set $osint_upstream http://osint-service:8005;
        rewrite ^/api/osint/(.*) /$1 break;
        proxy_pass $osint_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Hash Cracker API
    location /api/hash-cracker/ {
        set $hashcracker_upstream http://hash-cracker:8006;
        rewrite ^/api/hash-cracker/(.*) /$1 break;
        proxy_pass $hashcracker_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Auth Service API
    location /api/auth/ {
        set $auth_upstream http://auth-service:8007;
        rewrite ^/api/auth/(.*) /$1 break;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Zero-Day Researcher Service API
    location /api/researcher/ {
        set $researcher_upstream http://researcher-service:8008;
        rewrite ^/api/researcher/(.*) /$1 break;
        proxy_pass $researcher_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # WebSocket support (canlı log stream için)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # AI Service API (Ollama + Claude)
    # Türkçe: AI analiz istekleri için - uzun timeout gerekli
    location /api/ai/ {
        set $orchestrator_upstream http://orchestrator:8000;
        rewrite ^/api/ai/(.*) /ai/$1 break;
        proxy_pass $orchestrator_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE ve WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Türkçe: AI analizi ve PHANTOM taramaları uzun sürebilir
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Stress Testing Service API
    # Türkçe: Yük testi ve DDoS simülasyon servisi - WebSocket destekli
    location /api/stress/ {
        set $stress_upstream http://stress-service:8012;
        rewrite ^/api/stress/(.*) /$1 break;
        proxy_pass $stress_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # WebSocket support (real-time metrics)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Fuzz Service API
    location /api/fuzz/ {
        set $fuzz_upstream http://fuzz-service:8011;
        rewrite ^/api/fuzz/(.*) /$1 break;
        proxy_pass $fuzz_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
